name: Package

# Builds a ZIP the way the Release workflow does and checks what is in it, so
# a change that would ship a release without build/, or with source and test
# files, fails before anyone releases it.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Check release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Build the ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/stamp-version.sh 0.0.0-check
          git add -f build
          git add hm-user-activation.php
          git commit -q -m "Package check"
          git archive --format=zip --prefix=hm-user-activation/ -o hm-user-activation.zip HEAD

      - name: Check the ZIP
        run: .github/scripts/check-archive.sh hm-user-activation.zip 0.0.0-check
