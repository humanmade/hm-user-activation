name: Playwright Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # Core is pinned per lane to an exact tag, not a branch, so a re-run of an
    # old commit resolves to the same WordPress.
    e2e:
        name: WP ${{ matrix.label }}
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { label: '6.9', core: 'WordPress/WordPress#6.9.7', comment: true }
                    - { label: '7.0', core: 'WordPress/WordPress#7.0.4', comment: true }
                    - { label: '7.1', core: 'WordPress/WordPress#7.1', comment: true }
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run e2e suite
              id: suite
              uses: ./.github/actions/e2e-suite
              with:
                  label: ${{ matrix.label }}
                  core: ${{ matrix.core }}
                  comment_on_pr: ${{ matrix.comment }}

            - name: Fail if tests failed
              if: steps.suite.outputs.outcome == 'failure'
              run: exit 1

    # Separate job, and deliberately NOT in the aggregate's `needs`. A failure
    # on WordPress trunk is early warning of an upstream change, not a defect
    # in the commit under test, so it must not be able to hold up a merge.
    e2e-experimental:
        name: WP ${{ matrix.label }}
        timeout-minutes: 60
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: read
            pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { label: 'nightly', core: 'WordPress/WordPress#master', comment: false }
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run e2e suite
              id: suite
              uses: ./.github/actions/e2e-suite
              with:
                  label: ${{ matrix.label }}
                  core: ${{ matrix.core }}
                  comment_on_pr: ${{ matrix.comment }}

            - name: Flag experimental failure
              if: steps.suite.outputs.outcome == 'failure'
              run: |
                  echo "::warning title=WP ${{ matrix.label }} e2e failed::Non-blocking lane — see the job summary."
                  {
                    echo "### :warning: WP ${{ matrix.label }} e2e failed (non-blocking)"
                    echo
                    echo "This lane runs \`${{ matrix.core }}\` and does not gate merging."
                    echo "It is early warning of an upstream change, not a defect in this commit."
                  } >> "$GITHUB_STEP_SUMMARY"

    # Aggregate gate, so branch protection needs one required check instead of
    # one per WordPress version.
    test:
        name: test
        needs: [ e2e ]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check lane results
              env:
                  E2E: ${{ needs.e2e.result }}
              run: |
                  set -euo pipefail
                  echo "Blocking e2e lanes: $E2E"
                  [ "$E2E" = "success" ]
